<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="title desc">
  <title id="title">Languages and tools</title>
  <desc id="desc">TypeScript, Python, Bun, Node.js, PostgreSQL, Model Context Protocol, and GitHub Actions.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#142434"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="150" rx="24" fill="url(#panel)"/>
  <rect x="1" y="1" width="1198" height="148" rx="23" fill="none" stroke="#303d4d" stroke-width="2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    <g transform="translate(28 48)">
      <rect width="157" height="54" rx="14" fill="#3178c6"/>
      <text x="78.5" y="34" fill="#ffffff">TypeScript</text>
    </g>
    <g transform="translate(199 48)">
      <rect width="137" height="54" rx="14" fill="#3776ab"/>
      <text x="68.5" y="34" fill="#ffffff">Python</text>
    </g>
    <g transform="translate(350 48)">
      <rect width="94" height="54" rx="14" fill="#1f2937" stroke="#7d8590"/>
      <text x="47" y="34" fill="#ffffff">Bun</text>
    </g>
    <g transform="translate(458 48)">
      <rect width="131" height="54" rx="14" fill="#339933"/>
      <text x="65.5" y="34" fill="#ffffff">Node.js</text>
    </g>
    <g transform="translate(603 48)">
      <rect width="166" height="54" rx="14" fill="#4169e1"/>
      <text x="83" y="34" fill="#ffffff">PostgreSQL</text>
    </g>
    <g transform="translate(783 48)">
      <rect width="112" height="54" rx="14" fill="#7259d9"/>
      <text x="56" y="34" fill="#ffffff">MCP</text>
    </g>
    <g transform="translate(909 48)">
      <rect width="263" height="54" rx="14" fill="#2088ff"/>
      <text x="131.5" y="34" fill="#ffffff">GitHub Actions</text>
    </g>
  </g>
