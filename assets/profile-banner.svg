<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Miguel Ortiz — AI infrastructure engineer</title>
  <desc id="desc">Profile banner highlighting TypeScript, Python, agent runtimes, and Model Context Protocol.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#101b2a"/>
      <stop offset="1" stop-color="#142d3c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#72e6a8"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="48%" r="48%">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="28" fill="url(#background)"/>
  <rect x="1" y="1" width="1198" height="298" rx="27" fill="none" stroke="#303d4d" stroke-width="2"/>
  <rect width="1200" height="300" rx="28" fill="url(#glow)"/>

  <path d="M0 246 C160 208 278 286 438 242 S755 190 928 229 S1084 276 1200 230" fill="none" stroke="#58a6ff" stroke-opacity="0.12" stroke-width="2"/>
  <path d="M0 265 C164 225 290 298 448 258 S752 205 924 247 S1082 291 1200 251" fill="none" stroke="#72e6a8" stroke-opacity="0.09" stroke-width="2"/>

  <rect x="70" y="61" width="6" height="126" rx="3" fill="url(#accent)"/>
  <text x="102" y="119" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="54" font-weight="750" letter-spacing="2">MIGUEL ORTIZ</text>
  <text x="104" y="160" fill="#b6c5d6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="450">AI infrastructure engineer</text>
  <text x="104" y="194" fill="#8fa3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Provider-agnostic SDKs · Durable agents · MCP integrations</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="650">
    <rect x="103" y="220" width="126" height="36" rx="18" fill="#3178c6" fill-opacity="0.20" stroke="#4d9de0"/>
    <text x="166" y="243" fill="#d7ecff" text-anchor="middle">TypeScript</text>
    <rect x="241" y="220" width="106" height="36" rx="18" fill="#3776ab" fill-opacity="0.22" stroke="#5a98cb"/>
    <text x="294" y="243" fill="#d7ecff" text-anchor="middle">Python</text>
    <rect x="359" y="220" width="152" height="36" rx="18" fill="#72e6a8" fill-opacity="0.12" stroke="#72e6a8"/>
    <text x="435" y="243" fill="#baf4d4" text-anchor="middle">Agent runtimes</text>
    <rect x="523" y="220" width="82" height="36" rx="18" fill="#8b75ff" fill-opacity="0.17" stroke="#9d8cff"/>
    <text x="564" y="243" fill="#ddd7ff" text-anchor="middle">MCP</text>
  </g>

  <g transform="translate(936 150)">
    <circle r="89" fill="#58a6ff" fill-opacity="0.06" stroke="#58a6ff" stroke-opacity="0.26" stroke-width="2"/>
    <circle r="66" fill="none" stroke="#72e6a8" stroke-opacity="0.28" stroke-width="2" stroke-dasharray="5 8"/>
    <circle r="50" fill="#0d1117" fill-opacity="0.70" stroke="url(#accent)" stroke-width="2"/>
    <circle cx="-89" cy="0" r="5" fill="#72e6a8"/>
    <circle cx="65" cy="-61" r="5" fill="#58a6ff"/>
    <circle cx="48" cy="75" r="5" fill="#9d8cff"/>
    <circle cx="-34" cy="-57" r="9" fill="#72e6a8" fill-opacity="0.22" filter="url(#soft-glow)"/>
    <text x="0" y="13" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="36" font-weight="750" text-anchor="middle" letter-spacing="2">MO</text>
  </g>

  <g fill="none" stroke="#66849c" stroke-opacity="0.34" stroke-width="2">
    <path d="M819 87 H850 L876 113"/>
    <path d="M1022 91 H1060 L1093 58 H1143"/>
    <path d="M1024 212 H1071 L1097 238 H1150"/>
    <path d="M819 212 H853 L879 186"/>
  </g>
  <g fill="#72e6a8">
    <circle cx="819" cy="87" r="4"/>
    <circle cx="1143" cy="58" r="4"/>
  </g>
  <g fill="#58a6ff">
    <circle cx="819" cy="212" r="4"/>
    <circle cx="1150" cy="238" r="4"/>
  </g>
</svg>
